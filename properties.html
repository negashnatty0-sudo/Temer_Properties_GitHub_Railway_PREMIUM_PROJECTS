{% extends "base.html" %}{% block content %}<section class="section"><div class="container"><h1>Properties</h1><div class="form"><form><input name="q" value="{{query}}" placeholder="AI search: 3 bedroom in Bole under 15 million"><button class="btn dark">Search</button></form></div><p class="muted">{{properties|length}} properties found.</p><div class="grid">{% for p in properties %}<article class="card"><img src="{{p.image}}"><div class="cardbody"><span class="tag">{{p.status}}</span><h3>{{p.title}}</h3><div class="price">ETB {{'{:,.0f}'.format(p.price)}}</div><p class="muted">{{p.location}}</p><div class="meta"><span>🛏 {{p.beds}}</span><span>🛁 {{p.baths}}</span><span>📐 {{p.sqm}} m²</span></div><div class="actions"><a class="btn dark" href="/property/{{p.id}}">View Details</a><button class="btn light" onclick="saveProp({{p.id}})">♡</button></div></div></article>{% endfor %}</div></div></section>{% endblock %}
