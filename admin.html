{% extends "base.html" %}{% block content %}<section class="section"><div class="container"><h1>Temer Admin Dashboard</h1><div class="stats"><div class="stat"><small>Total Properties</small><br><b>{{properties|length}}</b></div><div class="stat"><small>Projects</small><br><b>{{projects|length}}</b></div><div class="stat"><small>Enquiries</small><br><b>0</b></div><div class="stat"><small>Users</small><br><b>0</b></div></div><div class="section"><h2>Manage Properties</h2>{% for p in properties %}<div class="form" style="margin-bottom:15px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="t{{p.id}}" value="{{p.title}}"><input id="l{{p.id}}" value="{{p.location}}"><input id="pr{{p.id}}" type="number" value="{{p.price}}"><input id="s{{p.id}}" value="{{p.status}}"></div><button class="btn" onclick="updateP({{p.id}})">Save Property</button></div>{% endfor %}</div></div></section><script>async function updateP(id){const d={id,title:document.getElementById('t'+id).value,location:document.getElementById('l'+id).value,price:+document.getElementById('pr'+id).value,status:document.getElementById('s'+id).value};const r=await fetch('/api/admin/property',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});alert((await r.json()).ok?'Property updated':'Update failed')}</script>{% endblock %}
