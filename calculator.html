{% extends "base.html" %}{% block content %}<section class="section"><div class="container"><h1>Affordability Calculator</h1><div class="form" style="max-width:650px"><label>Property price (ETB)</label><input id="price" type="number" value="12500000"><label>Deposit (ETB)</label><input id="deposit" type="number" value="2500000"><label>Annual interest (%)</label><input id="rate" type="number" value="12"><label>Term (years)</label><input id="years" type="number" value="20"><button class="btn" onclick="calc()">Calculate</button><h2 id="result"></h2><p class="muted">This is an estimate only. Actual financing terms depend on the lender.</p></div></div></section><script>function calc(){let P=Math.max(0,+document.getElementById('price').value-+document.getElementById('deposit').value),r=+document.getElementById('rate').value/100/12,n=+document.getElementById('years').value*12;let m=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;document.getElementById('result').textContent='Estimated monthly payment: ETB '+m.toLocaleString(undefined,{maximumFractionDigits:0})}</script>{% endblock %}
