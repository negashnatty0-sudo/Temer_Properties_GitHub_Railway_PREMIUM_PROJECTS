{% extends "base.html" %}{% block content %}<section class="section"><div class="container"><h1>Interactive Property Map</h1><p class="muted">Explore example property locations in Addis Ababa.</p><div id="map" class="map"></div></div></section><script>const map=L.map('map').setView([8.99,38.76],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const ps={{properties|tojson}};const coords=[[8.997,38.785],[9.02,38.82],[9.01,38.78],[9.01,38.75],[9.04,38.82],[8.98,38.77]];ps.forEach((p,i)=>{const m=L.marker(coords[i%coords.length]).addTo(map);m.bindPopup('<b>'+p.title+'</b><br>'+p.location+'<br>ETB '+p.price.toLocaleString()+'<br><a href="/property/'+p.id+'">View details</a>')})</script>{% endblock %}
